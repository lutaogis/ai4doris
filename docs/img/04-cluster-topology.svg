<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1080" viewBox="0 0 680 540" role="img" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>Doris 六节点集群拓扑</title>
<desc>数据源经 FE 的 9030 与 8030 端口接入，3 台 FE 管理元数据并生成查询计划，3 台 BE 承担存储与向量化计算，数据落在每台两块 SSD 数据盘上，按 3 副本冗余。</desc>
