<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="454" viewBox="0 0 680 454" role="img">
  <title>Apache Doris 分层架构</title>
  <desc>自上而下为客户端、FE 集群、BE 集群、外部数据源四个层次，FE 负责元数据与查询规划，BE 负责计算与存储。</desc>
  <style>
    text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="454" fill="#ffffff"/>

  <rect x="40" y="40" width="600" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">客户端 / BI 工具 / JDBC（MySQL 协议 :9030）</text>
  <line x1="340" y1="84" x2="340" y2="108" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="110" width="600" height="110" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="56" y="134" font-size="12" fill="#0C447C" font-weight="500">FE 集群 — 元数据与查询规划</text>
  <rect x="56" y="146" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="146" y="166" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#042C53" font-weight="500">Master</text>
  <text x="146" y="184" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">node-01 · 唯一写元数据</text>
  <rect x="250" y="146" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="166" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#042C53" font-weight="500">Follower</text>
  <text x="340" y="184" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">node-02 · 回放 edit log</text>
  <rect x="444" y="146" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="534" y="166" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#042C53" font-weight="500">Follower</text>
  <text x="534" y="184" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">node-03 · 参与选举</text>

  <line x1="340" y1="220" x2="340" y2="248" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="236" dominant-baseline="central" font-size="12" fill="#5F5E5A">Fragment 下发 :9060</text>

  <rect x="40" y="250" width="600" height="110" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="56" y="274" font-size="12" fill="#0F6E56" font-weight="500">BE 集群 — 计算与存储（存算一体）</text>
  <rect x="56" y="286" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="146" y="306" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#04342C" font-weight="500">BE node-04</text>
  <text x="146" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">执行引擎 + 存储引擎</text>
  <rect x="250" y="286" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="306" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#04342C" font-weight="500">BE node-05</text>
  <text x="340" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">执行引擎 + 存储引擎</text>
  <rect x="444" y="286" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="534" y="306" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#04342C" font-weight="500">BE node-06</text>
  <text x="534" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">执行引擎 + 存储引擎</text>

  <line x1="340" y1="360" x2="340" y2="388" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="376" dominant-baseline="central" font-size="12" fill="#5F5E5A">导入 / 外表读取 :8040</text>

  <rect x="40" y="390" width="600" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="412" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">外部数据源：HDFS / S3 / Hive / Iceberg / Kafka</text>
</svg>
