# ============================================================
# BE 配置  —— doris-node-04 ~ 06
# 规格：8C / 16G / 100G 系统盘 + 2 × 200G 数据盘
# 16G 是官方最低要求，内存参数必须收紧，否则 compaction 会 OOM
# ============================================================

# ---------- Java（4.x BE 的 JNI 库需要） ----------
JAVA_HOME = /usr/lib/jvm/java-17-openjdk-amd64

# ---------- 网络 ----------
priority_networks = 192.168.1.0/24

be_port = 9060
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

# ---------- 存储 ----------
# 两块数据盘各自挂载、单盘直通，不做 RAID / LVM
# 若数据盘是 HDD，把 medium:ssd 改成 medium:hdd
storage_root_path = /data1/doris,medium:ssd;/data2/doris,medium:ssd

# ---------- 内存（关键） ----------
# 16G × 80% = 12.8G 给 BE 进程
mem_limit = 80%
# 页缓存占总内存 20%，剩余留给 memtable / compaction / 查询
storage_page_cache_limit = 20%
# memtable 单表单分片写缓冲，默认 200M 在 16G 机器上太大，降到 100M
write_buffer_size = 104857600
# compaction 总内存上限，防止大批量导入时冲垮进程
compaction_max_memory_limit_percent = 40
# 导入内存占比（默认 90% 太高，多并发导入必炸）
load_process_max_memory_limit_percent = 30
load_process_max_memory_limit_bytes = 4294967296

# ---------- Compaction 并发（8C 机器保守点） ----------
max_compaction_concurrency = 4
max_base_compaction_concurrency = 1

# ---------- 存储水位 ----------
# 数据盘 200G，水位线到了会拒绝写入，提前告警
storage_high_watermark_usage_percent = 85
storage_medium_watermark_usage_percent = 60

# ---------- 磁盘 ----------
# 每块盘最多 20 个写线程，避免 200G 小盘被 IO 打满
storage_flush_thread_num = 4
