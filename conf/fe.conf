# ============================================================
# FE 配置  —— doris-node-01 ~ 03
# 规格：4C / 8G / 100G 系统盘
# 改完需重启 FE 生效
# ============================================================

# ---------- 网络 ----------
# 只监听 192.168.1.0/24 网段，多网卡时避免 FE 选错 IP
priority_networks = 192.168.1.0/24

query_port = 9030
http_port = 8030
rpc_port = 9020
edit_log_port = 9010

# ---------- 元数据 ----------
# 系统盘 100G，元数据 + BDBJE 日志都在这
meta_dir = /opt/doris/fe/meta

# ---------- JVM（8G 机器给 4G 堆，留 4G 给 OS/页缓存/BDB） ----------
# 注意：Doris 3.x/4.x 实际读取 JAVA_OPTS_FOR_JDK_17，两处都写以保证兼容
JAVA_OPTS = -Xmx4g -Xms4g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/opt/doris/fe/log
JAVA_OPTS_FOR_JDK_17 = -Dfile.encoding=UTF-8 -Djavax.security.auth.useSubjectCredsOnly=false -Xmx4g -Xms4g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/opt/doris/fe/log -Xlog:gc*:/opt/doris/fe/log/fe.gc.log.$CUR_DATE:time,uptime:filecount=10,filesize=50M -Darrow.enable_null_check_for_get=false --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.nio.cs=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.management/sun.management=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.xml/com.sun.org.apache.xerces.internal.jaxp=ALL-UNNAMED

# ---------- 日志（系统盘只有 100G，必须限制滚动） ----------
sys_log_level = INFO
sys_log_roll_num = 10
sys_log_verbose_modules =
audit_log_roll_num = 7
audit_log_roll_interval = DAY
audit_log_modules = slow_query, query
# 单文件上限 1G，防止日志吃满系统盘
sys_log_roll_interval = DAY

# ---------- 导入 ----------
# 注意：Doris 4.x 的 FE 已没有 streaming_load_max_mb（旧版才有），
# 该参数属于 BE 侧，已在 be.conf 中配置，此处不再声明。

# ---------- 连接 ----------
qe_max_connection = 1024
max_connection_scheduler_threads_num = 1024

# ---------- 查询 ----------
# 注意：Doris 4.x 已移除 max_query_concurrency，并发改由 Workload Group 控制：
#   ALTER WORKLOAD GROUP normal PROPERTIES ("max_concurrency" = "32");
# 这里的旧参数会被忽略，保留在模板中仅作提示，不写实际值。

# ---------- 存储水位 ----------
# 单盘使用率超过该值，FE 就不再把新副本调度到这台 BE（软水位）
# 注意：这个键属于 FE，不属于 BE（早期模板常写错位置）
storage_high_watermark_usage_percent = 85
storage_medium_watermark_usage_percent = 60

# ---------- 元数据回收 ----------
# 表/分区数量不大，默认策略即可，这里显式留白便于调
# label_keep_max_second = 259200
